name: Engineering maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 0'
      timezone: America/New_York

concurrency:
  group: huntforge-engineering
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - run: python -m pip install -r requirements-dev.txt
      - run: dotnet restore validator --locked-mode
      - run: dotnet build validator --configuration Release --no-restore
      - run: python -m unittest discover -s tests -v
      - id: candidate
        run: |
          set -euo pipefail
          git switch -c "codex/engineering-$GITHUB_RUN_ID"
          python -m automation.maintain
          git add -A -- website/assets website/style.css
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No eligible engineering task produced a change.' >> "$GITHUB_STEP_SUMMARY"
          else
            python -m pipeline.build
            python -m pipeline.verify
            git diff --cached --binary > /tmp/candidate.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: engineering-candidate
          path: /tmp/candidate.patch
          retention-days: 2

  review:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: engineering-candidate
          path: /tmp/engineering-review
      - run: |
          set -euo pipefail
          # Reproduce from the trusted commit without executing the candidate patch.
          python -m automation.maintain
          git add -A -- website/assets website/style.css
          git diff --cached --binary > /tmp/reproduced.patch
          cmp /tmp/reproduced.patch /tmp/engineering-review/candidate.patch
          echo 'Independent runner reproduced the complete candidate from the trusted base.' >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: engineering-candidate
          path: /tmp/engineering-review
      - name: Promote only the reviewed asset and stylesheet
        run: |
          set -euo pipefail
          git apply --index /tmp/engineering-review/candidate.patch
          diff -u <(printf '%s\n' website/assets/halftone.png website/assets/halftone.webp website/style.css) <(git diff --cached --no-renames --name-only)
          git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Optimize HuntForge halftone asset losslessly"
          git push origin "HEAD:refs/heads/codex/engineering-$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/main
      - name: Deploy and verify, reverting the candidate on failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          verified=false
          if gh workflow run release.yml --ref main; then
            for attempt in {1..18}; do
              run=$(gh run list --workflow release.yml --event workflow_dispatch --commit "$commit" --json databaseId --jq '.[0].databaseId // empty')
              if [[ -n "$run" ]]; then
                if timeout 720 gh run watch "$run" --exit-status; then verified=true; fi
                break
              fi
              sleep 5
            done
          fi
          if [[ "$verified" != true ]]; then
            git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' revert --no-edit HEAD
            git push origin HEAD:refs/heads/main
            exit 1
          fi
