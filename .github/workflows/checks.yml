name: Verify contribution
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - run: python -m pip install -r requirements-dev.txt
      - run: dotnet restore validator --locked-mode
      - run: dotnet build validator --configuration Release --no-restore
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.build && python -m pipeline.verify
