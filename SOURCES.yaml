schema_version: 1
policy:
  network: HTTPS requests to the exact registered endpoints. Reject redirects and non-public DNS answers.
  authentication: No credentials for active sources.
  retries: Three attempts for transient failures with a 15-second request timeout and exponential backoff.
  conditional_requests: Send ETag and Last-Modified validators when the local cache supplies them.
  retention: Raw payloads remain untracked. Accepted normalized records and archived snapshots remain in Git.
  freshness: A successful retrieval is fresh for 48 hours. Failed sources preserve their last accepted records.
sources:
  - id: cisa-kev
    status: active
    trust: government catalog
    publisher: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    endpoint: https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json
    adapter: pipeline.sources.kev
    dates: dateAdded and dateReleased
    access: Public official GitHub mirror. One conditional request per run.
    rights: CC0 with source attribution.
    coverage: Catalog additions within the window and rechecks for previously accepted CVEs.
  - id: first-epss
    status: active
    trust: published probability model
    publisher: https://www.first.org/epss/data
    endpoint: https://api.first.org/data/v1/epss
    adapter: pipeline.sources.epss
    dates: date in score and time-series fields
    access: Public API. At most 35 CVEs per request with one-second pacing.
    rights: Publish a scoped subset of numerical data with attribution.
    coverage: Score time series for CISA KEV entries in the collection window, where FIRST returns scores.
  - id: cisa-advisories
    status: active
    trust: government advisory
    publisher: https://www.cisa.gov/news-events/cybersecurity-advisories
    endpoint: https://www.cisa.gov/cybersecurity-advisories/all.xml
    historical_listing: https://www.cisa.gov/news-events/cybersecurity-advisories?page=0
    adapter: pipeline.sources.advisory
    dates: RSS pubDate and advisory listing Release Date
    access: Public RSS and up to five archive pages.
    rights: Attribute title/date metadata and link to the publisher.
    coverage: Publisher advisories and alerts visible in the RSS and archive.
  - id: microsoft
    status: active
    trust: primary vendor research
    publisher: https://www.microsoft.com/en-us/security/blog/
    endpoint: https://www.microsoft.com/en-us/security/blog/feed/
    adapter: pipeline.sources.advisory
    dates: RSS pubDate or reviewed original publication date
    access: Public WordPress feed. Up to six pages.
    rights: Attribution, source links and independently written summaries. No full posts.
    coverage: Security-tagged articles plus reviewed evidence attached to accepted hunts.
  - id: ncsc
    status: active
    trust: government advisory
    publisher: https://www.ncsc.gov.uk/information/rss-feeds
    endpoint: https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml
    adapter: pipeline.sources.advisory
    dates: RSS pubDate
    access: Public single-page feed.
    rights: Attribute metadata and link to the publisher.
    coverage: Publisher buffer. Partial when the oldest entry postdates the window start.
  - id: mitre
    status: active
    trust: curated reference
    publisher: https://attack.mitre.org/resources/attack-data-and-tools/
    endpoint: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
    adapter: pipeline.sources.attack
    dates: STIX collection and object modified values
    access: Public GitHub STIX and license. One request each.
    rights: Reproduce original MITRE license and attribution alongside the index.
    coverage: Current Enterprise reference snapshot.
  - id: cert-fr
    status: active
    trust: government advisory
    publisher: https://cert.cyber.gouv.fr/flux-rss/
    endpoint: https://cert.cyber.gouv.fr/avis/feed/
    adapter: pipeline.sources.advisory
    dates: RSS pubDate, retained independently of retrieval and later site edits.
    access: Public single-page security advisories feed. No advisory pages fetched by the collector.
    rights: Attribute reference number, original French title and publication date. Write original summaries and link to the bulletin.
    coverage: French security advisories visible in the publisher buffer. Partial when the oldest entry postdates the window start.
  - id: unit-42
    status: active
    trust: primary vendor research
    publisher: https://unit42.paloaltonetworks.com/unit-42-all-articles/
    endpoint: https://unit42.paloaltonetworks.com/category/threat-research/feed/
    adapter: pipeline.sources.advisory
    dates: RSS pubDate
    access: Public single-page RSS scoped to the Threat Research category.
    rights: Attribution, source links and independently written summaries. No publisher excerpts, images or full posts.
    coverage: Threat Research entries available in the feed buffer.
  - id: cisco-talos
    status: active
    trust: primary vendor advisory and research
    publisher: https://blog.talosintelligence.com/category/threat-advisory/
    endpoint: https://blog.talosintelligence.com/category/threat-advisory/rss/
    supplemental_endpoints:
      - https://blog.talosintelligence.com/rss/
      - https://blog.talosintelligence.com/category/threat-spotlight/rss/
    adapter: pipeline.sources.advisory
    dates: RSS pubDate
    access: One public RSS page from each endpoint. Merge by publisher GUID.
    rights: Attribution, source links and independently written summaries. No publisher excerpts, images or full posts.
    coverage: Published Threat Advisories, Threat Spotlights and selected threat research, patch coverage and incident response reporting.
  - id: fbi-flash
    status: active
    trust: government advisory
    publisher: https://www.ic3.gov/CSA
    endpoint: https://www.ic3.gov/CSA/rss
    adapter: pipeline.sources.advisory
    dates: RSS pubDate, using the publisher's local date.
    access: Public Industry Alerts RSS. One page. No attachment downloads.
    rights: Attribute and link to the original notice. Publish title, date and independently written summaries.
    coverage: FBI FLASH notices and other alerts visible in the IC3 Industry Alerts feed.
  - id: google-threat-intelligence
    status: active
    trust: primary vendor research
    publisher: https://cloud.google.com/blog/topics/threat-intelligence
    endpoint: https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v
    adapter: pipeline.sources.advisory
    dates: RSS pubDate
    access: Public single-page RSS advertised on the Google Cloud threat intelligence blog. Evidence links must point to Google's threat intelligence blog.
    rights: Attribute title and date, link to the article, and publish independently written summaries.
    coverage: Public Google Threat Intelligence Group and Mandiant publications in the feed buffer.
  - id: securelist
    status: active
    trust: primary vendor research
    publisher: https://securelist.com/
    endpoint: https://securelist.com/feed/
    supplemental_endpoints:
      - https://securelist.com/feed/?paged=2
      - https://securelist.com/feed/?paged=3
    adapter: pipeline.sources.advisory
    dates: RSS pubDate
    access: Public RSS. Up to three fixed pages, stopping after reaching the window start.
    rights: Attribute title and date to Securelist and link to the article. No article excerpts or imagery.
    coverage: Public malware, vulnerability, threat statistics and campaign research in the feed pages.
  - id: dfir-report
    status: active
    trust: primary incident research
    publisher: https://thedfirreport.com/
    endpoint: https://thedfirreport.com/feed/
    adapter: pipeline.sources.advisory
    dates: RSS pubDate
    access: Public single-page RSS. The subscribed threat feed and lab resources are excluded.
    rights: Attribute titles, dates and source links. Do not copy article text, subscriber indicators or lab telemetry.
    coverage: Public intrusion reports in the publisher buffer. Keep older visible reports as historical research and count them separately from the daily window.
  - id: shadowserver
    status: active
    trust: primary nonprofit research
    publisher: https://www.shadowserver.org/news-insights/
    endpoint: https://www.shadowserver.org/news-insights/
    adapter: pipeline.sources.shadowserver
    dates: Publication date on the public listing.
    access: One public News & Insights listing page. No member reports, data downloads or dashboard queries.
    rights: Attribute and link to public publications. Exclude restricted report content and raw scan data.
    coverage: Public threat, exposure and remediation publications on the latest listing.
  - id: greynoise
    status: active
    trust: primary vendor research
    publisher: https://docs.greynoise.io/reference/getpublicrssfeed
    endpoint: https://api.greynoise.io/v3/articles/rss
    adapter: pipeline.sources.advisory
    dates: RSS pubDate
    access: Unauthenticated public Community Threat Briefs RSS. One page.
    rights: Attribute publication metadata and link to each article. Exclude private feeds and raw scan observations.
    coverage: Community threat briefs visible in the public feed buffer.
evaluated_inactive:
  - id: threatfox
    publisher: https://threatfox.abuse.ch/api/
    reason: The official IOC API and exports require an Auth-Key. Review historical scope, expiry semantics and public redistribution before enabling.
  - id: urlhaus
    publisher: https://urlhaus.abuse.ch/api/
    reason: The official URL feed requires an Auth-Key. Review public redistribution. Never retrieve URLs listed as indicators.
  - id: malwarebazaar
    publisher: https://bazaar.abuse.ch/api/
    reason: The official metadata API requires an Auth-Key. Review hash and metadata redistribution. Samples are excluded.
  - id: alienvault-otx
    publisher: https://otx.alienvault.com/api
    reason: The documented DirectConnect subscription feed requires an OTX key. Review community verification and contributor reuse rights before public ingestion.
  - id: microsoft-sentinel-repository
    publisher: https://github.com/Azure/Azure-Sentinel
    reason: Use Microsoft documentation for table semantics. Source-code imports require individual review.
  - id: sigmahq
    publisher: https://github.com/SigmaHQ/sigma
    reason: Keep candidate evidence separate until rule attribution, reuse terms and support are reviewed.
